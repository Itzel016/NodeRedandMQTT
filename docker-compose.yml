services:

  emqx:
    image: emqx/emqx-enterprise:6.3.1
    container_name: emqx
    hostname: node1.emqx.local

    environment:
      EMQX_NODE_NAME: emqx@node1.emqx.local

    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"

    volumes:
      - ./emqx/data:/opt/emqx/data
      - ./emqx/log:/opt/emqx/log

    networks:
      - iot-network

    restart: unless-stopped


  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile

    container_name: mynodered

    ports:
      - "1880:1880"

    volumes:
      - ./nodered/data:/data

    networks:
      - iot-network

    depends_on:
      - emqx

    restart: unless-stopped


networks:
  iot-network:
    external: true
